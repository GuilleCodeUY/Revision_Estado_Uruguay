<!doctype html>
<html lang="es-UY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · La verdad de la milanesa</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--ink:#111;--paper:#fffdf6;--yellow:#ffd23f;--dark:#121212}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--dark);color:#fff;font:1rem/1.5 Inter,system-ui,sans-serif}
    a{color:inherit}:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
    .wrap{width:min(1100px,calc(100% - 2rem));margin:auto}
    .logo{display:inline-block;padding:.8rem 0;font-weight:900;font-size:1.35rem;letter-spacing:-.03em;text-decoration:none}.logo span{color:var(--yellow)}
    main{flex:1;display:flex;align-items:center}
    .big{font-size:clamp(5rem,20vw,11rem);font-weight:900;letter-spacing:-.06em;line-height:.9;color:var(--yellow)}
    h1{font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.04em;margin:.4rem 0 .6rem;line-height:1.05}
    p{color:#ddd;max-width:42ch;font-size:1.1rem}
    .btns{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
    .btn{display:inline-block;padding:.75rem 1.1rem;border-radius:.35rem;font-weight:800;text-decoration:none;border:2px solid var(--yellow)}
    .btn.y{background:var(--yellow);color:#111}.btn.o{color:var(--yellow)}
  </style>
</head>
<body>
  <header class="wrap"><a class="logo" href="/">La verdad de la <span>milanesa</span></a></header>
  <main class="wrap">
    <div>
      <div class="big">404</div>
      <h1>Este dato no existe.</h1>
      <p>La página que buscás no está acá. Puede que el enlace esté mal escrito o que la hayamos movido.</p>
      <div class="btns"><a class="btn y" href="/">Ir a la portada</a><a class="btn o" href="/#casos">Ver los casos</a></div>
    </div>
  </main>
</body>
</html>
