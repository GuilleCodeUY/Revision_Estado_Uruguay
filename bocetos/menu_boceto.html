<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boceto · menú</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fffdf6}
    .vm-barra{position:sticky;top:0;z-index:50;background:#121212;color:#fff;border-bottom:1px solid #2a2a2a;font-family:Inter,system-ui,sans-serif}
    .vm-barra .vm-wrap{width:min(1240px,calc(100% - 2rem));margin:auto;display:flex;align-items:center;gap:1.2rem;min-height:3.5rem}
    .vm-logo{font-weight:900;font-size:1.15rem;letter-spacing:-.03em;text-decoration:none;white-space:nowrap;color:#fff}.vm-logo span{color:#ffd23f}
    .vm-menu{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;margin-left:auto}.vm-menu::-webkit-scrollbar{display:none}
    .vm-menu a{flex:none;color:#fff;text-decoration:none;font-size:.86rem;font-weight:800;padding:.4rem .7rem;border-radius:999px;min-height:2.4rem;box-sizing:border-box;display:inline-flex;align-items:center;white-space:nowrap;border:2px solid var(--c);background:var(--cs)}
    .vm-menu a:hover{background:var(--ch)}.vm-menu a[aria-current]{background:var(--c);color:#111}
    .vm-menu a.vm-sec{border:0;background:none;color:#bbb;font-weight:700;font-size:.8rem;padding:.4rem .35rem}
    .vm-menu a.vm-sec:hover{color:#fff;background:none}.vm-menu a.vm-sec[aria-current]{color:#fff;background:#2a2a2a;border-radius:.3rem}
    .vm-menu{align-items:center;gap:.3rem;padding:.35rem 0}
    html{scroll-padding-top:4rem}
    header .top .logo,header .cabecera>a{display:none}header .top{justify-content:flex-start}
    @media(max-width:760px){.vm-barra .vm-wrap{flex-wrap:wrap;gap:0;min-height:0;padding:.45rem 0 0}.vm-menu{margin:0 -1rem;padding:0 1rem .3rem;width:calc(100% + 2rem)}}

.vm-esp{flex:none;position:static}
.vm-esp summary{list-style:none;cursor:pointer;color:#111;background:#fff;font-size:.86rem;font-weight:800;padding:.4rem .8rem;border-radius:999px;min-height:2.4rem;box-sizing:border-box;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.vm-esp summary::-webkit-details-marker{display:none}
.vm-esp[open] summary{background:#ffd23f}
.vm-esp-panel{position:fixed;top:3.6rem;right:max(1rem,calc((100vw - 1240px)/2));width:min(320px,calc(100vw - 2rem));background:#1b1b1b;border:1px solid #333;border-radius:.6rem;padding:.4rem;box-shadow:0 12px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:.3rem}
.vm-esp-panel a{display:block;color:#fff;text-decoration:none;padding:.55rem .75rem;border-radius:.45rem;border-left:5px solid var(--c);font-weight:800;font-size:.92rem;background:#242424}
.vm-esp-panel a:hover{background:#2e2e2e}.vm-esp-panel small{display:block;color:var(--c);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}

.lbl{font:800 .9rem Inter,system-ui;padding:1rem;color:#111}.boceto{background:#ffd23f;text-align:center;font-weight:700;padding:.45rem}</style></head><body>
<div class="boceto">BOCETO · menú superior</div>
<header class="vm-barra"><div class="vm-wrap"><a class="vm-logo" href="#">La verdad de la <span>milanesa</span></a><nav class="vm-menu"><a href="#" style="--c:#ffd23f;--cs:rgba(255,210,63,.16);--ch:rgba(255,210,63,.32)">Parlamento</a><a href="#" style="--c:#3ddc97;--cs:rgba(61,220,151,.16);--ch:rgba(61,220,151,.32)">Intendencias</a><a href="#" style="--c:#ff8fa0;--cs:rgba(255,143,160,.16);--ch:rgba(255,143,160,.32)">Solaria</a><a href="#" style="--c:#ff7a1a;--cs:rgba(255,122,26,.16);--ch:rgba(255,122,26,.32)">Puerto</a><a href="#" style="--c:#5ce1e6;--cs:rgba(92,225,230,.16);--ch:rgba(92,225,230,.32)">UTE</a><a href="#" style="--c:#ff4b2b;--cs:rgba(255,75,43,.16);--ch:rgba(255,75,43,.32)">ANCAP</a><details class="vm-esp"><summary>Especiales <span aria-hidden="true">▾</span></summary><div class="vm-esp-panel"><a href="#" style="--c:#a78bfa"><small>Informe especial 1</small>Auto eléctrico: ¿sí o no?</a><a href="#" style="--c:#a3e635"><small>Informe especial 2</small>La reforma del transporte</a></div></details><a class="vm-sec" href="#">Informe 2025</a><a class="vm-sec" href="#">Correcciones</a><a class="vm-sec" href="#">Contacto</a></nav></div></header>
<div style="background:#121212;color:#fff;padding:2rem 1rem 3rem;font:900 3rem Inter,system-ui">Lo que gasta el Estado.</div><div style="height:200px"></div><script>document.querySelectorAll(".vm-esp").forEach(function(d){
function pos(){var p=d.querySelector(".vm-esp-panel"),h=d.closest(".vm-barra").getBoundingClientRect(),s=d.querySelector("summary").getBoundingClientRect();
p.style.top=(h.bottom+6)+"px";var w=p.offsetWidth,l=Math.min(Math.max(8,s.right-w),innerWidth-w-8);p.style.left=l+"px";p.style.right="auto";}
d.addEventListener("toggle",function(){if(d.open)pos();});addEventListener("resize",function(){if(d.open)pos();});
document.addEventListener("click",function(e){if(d.open&&!d.contains(e.target))d.open=false;});});</script></body></html>
